#---------------------------------------------------#
# 现代 Clash Meta (Mihomo) 通用配置模板
# 删除了繁杂冗长的无效选项，启用了强力 Sniffer 和现代 DNS
#---------------------------------------------------#
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
mode: rule
log-level: info
external-controller: '0.0.0.0:9090'

# 【新增】全局流量嗅探，解决透明代理和部分软件直连 DNS 泄露导致的匹配失效
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# 【修改】完全重构的现代 DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 精简且现代的 fake-ip 过滤，避免系统更新/局域网连接出 bug
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'time1.*.com'
    - 'time2.*.com'
    - 'time3.*.com'
    - 'time4.*.com'
    - 'time5.*.com'
    - 'time6.*.com'
    - 'time7.*.com'
    - 'ntp.*.com'
    - 'ntp1.*.com'
    - 'ntp2.*.com'
    - 'ntp3.*.com'
    - 'ntp4.*.com'
    - 'ntp5.*.com'
    - 'ntp6.*.com'
    - 'ntp7.*.com'
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - '*.openwrt.pool.ntp.org'
    - '+'
    
  # 新版分流解析逻辑，去除繁杂的 fallback
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  nameserver-policy:
    'geosite:cn':
      - https://223.5.5.5/dns-query
      - 114.114.114.114
